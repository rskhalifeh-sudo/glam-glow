<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In · Glam & Glow</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <section class="signin-section">
    <div class="signin-background">

      <div class="signin-card">

        <!-- LEFT VISUAL SIDE -->
        <div class="signin-visual">
          <img src="images/Logo.png" alt="Glam and Glow logo" />
          <h2>Welcome Back</h2>
          <p>Your skin journey continues here.</p>

          <ul class="visual-points">
            <li>Book and manage your appointments</li>
            <li>See your treatment history</li>
            <li>Get personalized skincare advice</li>
          </ul>
        </div>

        <!-- RIGHT FORM SIDE -->
        <div class="signin-form-side">
          <h1>Sign In</h1>
          <p>Enter your details to access your account.</p>

          <form id="signin-form" novalidate>

            <div class="input-box">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" placeholder="maria@example.com" required />
            </div>

            <div class="input-box">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Your password" required minlength="8" />
              <button type="button" class="toggle-pass" data-target="password">Show</button>
            </div>

            <div class="form-options">
              <label>
                <input type="checkbox" id="remember" name="remember" />
                Remember me
              </label>
              <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="submit-btn">Sign In</button>

            <p class="form-note" id="form-note"></p>
          </form>

          <div class="account-switch">
            <p>Don't have an account?</p>
            <a href="signup.htm">Create one</a>
          </div>

          <a href="index.html" class="back-home">&#8592; Back to website</a>
        </div>

      </div>
    </div>
  </section>

  <script>
    /* show / hide password */
    document.querySelectorAll(".toggle-pass").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var input = document.getElementById(btn.dataset.target);
        var hidden = input.type === "password";
        input.type = hidden ? "text" : "password";
        btn.textContent = hidden ? "Hide" : "Show";
      });
    });

    /* front-end validation only — real login happens on the server */
    var form = document.getElementById("signin-form");
    var note = document.getElementById("form-note");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = document.getElementById("email").value.trim();
      var password = document.getElementById("password").value;

      if (!email.includes("@") || !email.includes(".")) {
        note.textContent = "Please enter a valid email address.";
        return;
      }
      if (password.length < 8) {
        note.textContent = "Password must be at least 8 characters.";
        return;
      }

      note.textContent = "Checking your details...";
      /* TODO: send email + password to the backend for verification */
    });
  </script>

</body>
</html>
